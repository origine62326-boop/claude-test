# USDJPY_LowRisk_Trend_EA.mq4 の入力パラメータのうち、リスクに関わる値をミラーしたもの。
# 分析側(trade_anomaly_check.py等)がEAの安全設計を前提としたチェックを行う際の参照値。
#
# 重要: ここは「EA側の実際の入力値」を人間が転記するものであり、自動同期はしていない。
# EA側のパラメータ(mt4/USDJPY_LowRisk_Trend_EA.mq4)を変更した場合は、必ずこちらも
# 手動で更新すること。ズレたままだと異常検知が誤判定する。
# (2026-07-28時点でこのyaml自体はどのPythonコードからも読み込まれていない。
#  将来読み込む実装を追加する場合は、下記のimplementation_statusブロックも
#  合わせてパースするか、コメントのまま参照するかを実装時に決めること)

magic_number: 20260714
risk_percent: 0.5                # 1トレードの許容損失(口座残高に対する%)
maximum_lot: 1.0                 # trade_anomaly_check.py の --max-lot にそのまま渡せる
max_spread_pips: 3.0
atr_stop_multiplier: 1.5
reward_risk_ratio: 2.0
min_stop_loss_pips: 5.0
max_stop_loss_pips: 100.0
allow_live_trading: false        # 必ずfalseであることを人間が確認すること

# --- 日次損失上限・連敗制限 ---
# 下記2値は main 上のEA入力パラメータのデフォルト値をそのまま転記したものであり、
# 「main上で機能として有効」であることを意味しない。機能としての実装は
# implementation_status.merge_status が MERGED_TO_MAIN になるまで main 上には存在しない。
# 詳細は trading-system/research/risk/RISK_ENGINE_SPEC.md を参照。
max_daily_loss_percent: 2.0
max_consecutive_losses: 3

# --- 日次損失上限・連敗制限(Phase 5-1)の実装状況 ---
# main実装済みと誤認しないこと。値の意味は trading-system/research/risk/RISK_ENGINE_SPEC.md と同一。
implementation_status:
  daily_loss_and_consecutive_loss_limits:
    source_branch: claude/ea-v0.3.0-risk-management   # mainには未マージ
    merge_status: NOT_MERGED_TO_MAIN
    compile_status: PENDING_USER_METAEDITOR_CONFIRMATION  # 当該ブランチのCHANGELOG.mdに「コンパイル確認・バックテスト検証待ちのため未タグ・未リリース」と明記されており、0 errors/0 warningsの確認はまだ得られていない
    backtest_status: UNVERIFIED_OBSERVATION             # 会話内スクリーンショットのみ。research/data/DATASET_REGISTRY.md DS002参照。パイプライン未検証
    full_test_plan_status: PARTIALLY_COMPLETE           # trading-system/mt4/TEST_PLAN_PHASE5-1.md 全20項目中、コードレビュー代替5項目(#11,#13,#14,#15,#16)のみ確認済み
    demo_forward_status: NOT_STARTED
    live_approval_status: NOT_APPROVED                  # allow_live_trading: false を維持
